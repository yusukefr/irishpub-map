name: Update PR App Version

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read
  pull-requests: write

jobs:
  update:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      APP_VERSION_BUMP: ${{ vars.APP_VERSION_BUMP || 'patch' }}

    steps:
      - name: Checkout pull request branch for classification
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changes
        id: changes
        env:
          CI_EVENT_NAME: pull_request
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/classify-ci-changes.mjs

      - name: Create GitHub App token
        if: steps.changes.outputs.version_relevant == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.APP_VERSION_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_VERSION_GITHUB_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout pull request branch for version update
        if: steps.changes.outputs.version_relevant == 'true'
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js
        if: steps.changes.outputs.version_relevant == 'true'
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Update version in pull request branch
        if: steps.changes.outputs.version_relevant == 'true'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch origin "$BASE_REF"
          if git diff --quiet "origin/$BASE_REF...HEAD" -- app-version.json; then
            npm run update-app-version
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app-version.json package.json package-lock.json
            git commit -m "chore: update app version for PR #$PR_NUMBER"
            git push origin "HEAD:$HEAD_REF"
          fi

      - name: Update pull request body
        if: steps.changes.outputs.version_relevant == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr view "$PR_NUMBER" --json body --jq .body > "$RUNNER_TEMP/pr-body.md"
          node scripts/update-pr-app-version.mjs < "$RUNNER_TEMP/pr-body.md" > "$RUNNER_TEMP/updated-pr-body.md"
          gh pr edit "$PR_NUMBER" --body-file "$RUNNER_TEMP/updated-pr-body.md"
