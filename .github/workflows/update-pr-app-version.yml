name: Update PR App Version

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      APP_VERSION_BUMP: ${{ vars.APP_VERSION_BUMP || 'patch' }}

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Update version in pull request branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch origin "$BASE_REF"
          if git diff --quiet "origin/$BASE_REF...HEAD" -- app-version.json; then
            npm run update-app-version
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app-version.json
            git commit -m "chore: update app version for PR #$PR_NUMBER"
            git push origin "HEAD:$HEAD_REF"
          fi

      - name: Update pull request body
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr view "$PR_NUMBER" --json body --jq .body > "$RUNNER_TEMP/pr-body.md"
          node scripts/update-pr-app-version.mjs < "$RUNNER_TEMP/pr-body.md" > "$RUNNER_TEMP/updated-pr-body.md"
          gh pr edit "$PR_NUMBER" --body-file "$RUNNER_TEMP/updated-pr-body.md"
