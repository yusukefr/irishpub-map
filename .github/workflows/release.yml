name: Production Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

concurrency:
  group: production-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Check current main commit
        id: current
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" = "$RELEASE_SHA" ] && [ "$(git rev-parse origin/main)" = "$RELEASE_SHA" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping superseded main commit."
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check deployment credentials
        if: steps.current.outputs.release == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Production deployment credentials are not configured." >&2
            exit 1
          fi

      - name: Setup Node.js
        if: steps.current.outputs.release == 'true'
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Prepare Vercel CLI
        if: steps.current.outputs.release == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install --global vercel@62.2.0
          vercel pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Prepare annotated release tag
        if: steps.current.outputs.release == 'true'
        id: metadata
        run: |
          git config user.name "Release Workflow"
          git config user.email "release@localhost"
          node scripts/prepare-release.mjs

      - name: Deploy tagged commit to Vercel Production
        if: steps.current.outputs.release == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          APP_RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          APP_RELEASE_DATE: ${{ steps.metadata.outputs.released_at }}
          APP_RELEASE_GIT_SHA: ${{ steps.metadata.outputs.git_sha }}
        run: |
          test "$(git rev-parse "${APP_RELEASE_VERSION}^{commit}")" = "$RELEASE_SHA"
          vercel deploy --prod --yes --token "$VERCEL_TOKEN" \
            --build-env "APP_RELEASE_VERSION=$APP_RELEASE_VERSION" \
            --build-env "APP_RELEASE_DATE=$APP_RELEASE_DATE" \
            --build-env "APP_RELEASE_GIT_SHA=$APP_RELEASE_GIT_SHA" \
            --env "APP_RELEASE_VERSION=$APP_RELEASE_VERSION" \
            --env "APP_RELEASE_DATE=$APP_RELEASE_DATE" \
            --env "APP_RELEASE_GIT_SHA=$APP_RELEASE_GIT_SHA"
