name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      code_changed: ${{ steps.changes.outputs.code_changed }}
    env:
      SLACK_CICD_CHANNEL: ${{ vars.SLACK_CICD_CHANNEL }}
      SLACK_CICD_WEBHOOK_URL: ${{ secrets.SLACK_CICD_WEBHOOK_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Classify changes
        id: changes
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node scripts/classify-ci-changes.mjs

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: ${{ (steps.changes.outputs.code_changed == 'true' || steps.changes.outputs.openapi_changed == 'true') && 'npm' || '' }}

      - name: Install dependencies
        if: steps.changes.outputs.code_changed == 'true' || steps.changes.outputs.openapi_changed == 'true'
        run: npm ci

      - name: Check sensitive data
        run: npm run check:sensitive-data

      - name: Format check
        if: steps.changes.outputs.code_changed == 'true'
        run: npm run format:check

      - name: OpenAPI lint
        if: steps.changes.outputs.code_changed == 'true' || steps.changes.outputs.openapi_changed == 'true'
        run: npm run lint:openapi

      - name: Lint
        if: steps.changes.outputs.code_changed == 'true'
        run: npm run lint

      - name: Test
        if: steps.changes.outputs.code_changed == 'true'
        run: npm test

      - name: Build
        if: steps.changes.outputs.code_changed == 'true'
        run: npm run build

      - name: Build Storybook
        if: steps.changes.outputs.code_changed == 'true'
        run: npm run build-storybook

      - name: Notify Slack
        if: always() && env.SLACK_CICD_WEBHOOK_URL != ''
        env:
          JOB_STATUS: ${{ job.status }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          status = os.environ["JOB_STATUS"]
          icon = "✅" if status == "success" else "❌"
          payload = {
              "text": (
                  f"{icon} {os.environ['WORKFLOW']} {status}\n"
                  f"Repository: {os.environ['REPOSITORY']}\n"
                  f"Branch: {os.environ['REF_NAME']}\n"
                  f"Run: {os.environ['RUN_URL']}"
              ),
          }
          channel = os.environ.get("SLACK_CICD_CHANNEL")
          if channel:
              payload["channel"] = channel
          request = urllib.request.Request(
              os.environ["SLACK_CICD_WEBHOOK_URL"],
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=10) as response:
              response.read()
          PY

  e2e:
    name: E2E
    if: needs.ci.outputs.code_changed == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SLACK_CICD_CHANNEL: ${{ vars.SLACK_CICD_CHANNEL }}
      SLACK_CICD_WEBHOOK_URL: ${{ secrets.SLACK_CICD_WEBHOOK_URL }}
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install dependencies
        run: npm ci

      - name: E2E
        run: npm run test:e2e

      - name: Storybook component browser tests
        run: npm run test:storybook

      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 10

      - name: Notify Slack on E2E failure
        if: failure() && env.SLACK_CICD_WEBHOOK_URL != ''
        env:
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          payload = {
              "text": (
                  f"❌ E2E failed\n"
                  f"Repository: {os.environ['REPOSITORY']}\n"
                  f"Branch: {os.environ['REF_NAME']}\n"
                  f"Run: {os.environ['RUN_URL']}"
              ),
          }
          channel = os.environ.get("SLACK_CICD_CHANNEL")
          if channel:
              payload["channel"] = channel
          request = urllib.request.Request(
              os.environ["SLACK_CICD_WEBHOOK_URL"],
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=10) as response:
              response.read()
          PY
