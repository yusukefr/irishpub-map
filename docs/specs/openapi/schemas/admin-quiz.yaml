AdminQuizListResponse:
  type: object
  additionalProperties: false
  required: [questions, databaseConfigured]
  properties:
    questions:
      type: array
      items: { $ref: ./automation.yaml#/QuizListItem }
    databaseConfigured: { type: boolean }

AdminQuizWriteInput:
  allOf:
    - $ref: ./automation.yaml#/QuizWrite
    - not:
        required: [id]
        properties:
          id: { type: string }
  description: The Question ID is generated by the server and is not accepted in the request body.

AdminQuizResponse:
  type: object
  additionalProperties: false
  required: [question]
  properties:
    question: { $ref: ./automation.yaml#/Quiz }

AdminQuizPublicationResponse:
  type: object
  additionalProperties: false
  required: [publication]
  properties:
    publication: { $ref: ./automation.yaml#/BooleanPublication }
