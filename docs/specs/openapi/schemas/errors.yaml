ErrorBody:
  type: object
  required: [errorCode]
  properties:
    errorCode:
      type: string

ErrorResponse:
  description: Error response
  content:
    application/json:
      schema:
        $ref: "#/ErrorBody"

Unauthorized:
  description: An authenticated administrator session is required.
  content:
    application/json:
      schema:
        allOf:
          - $ref: "#/ErrorBody"
          - type: object
            properties:
              errorCode:
                const: unauthorized

Forbidden:
  description: The request origin is not allowed.
  content:
    application/json:
      schema:
        allOf:
          - $ref: "#/ErrorBody"
          - type: object
            properties:
              errorCode:
                const: forbidden

InvalidRequest:
  description: The path parameter is invalid.
  content:
    application/json:
      schema:
        allOf:
          - $ref: "#/ErrorBody"
          - type: object
            properties:
              errorCode:
                const: invalid_request

InvalidPrefectureCode:
  description: The prefectureCode query parameter is invalid.
  content:
    application/json:
      schema:
        allOf:
          - $ref: "#/ErrorBody"
          - type: object
            properties:
              errorCode:
                const: invalid_prefecture_code

InvalidRequestBody:
  allOf:
    - $ref: "#/ErrorBody"
    - type: object
      properties:
        errorCode:
          const: invalid_request

InvalidJsonBody:
  allOf:
    - $ref: "#/ErrorBody"
    - type: object
      properties:
        errorCode:
          const: invalid_json

InvalidRequestOrInvalidJson:
  description: The path parameter is invalid or the request body is not valid JSON.
  content:
    application/json:
      schema:
        oneOf:
          - $ref: "#/InvalidRequestBody"
          - $ref: "#/InvalidJsonBody"

InvalidJson:
  description: The request body is not valid JSON.
  content:
    application/json:
      schema:
        allOf:
          - $ref: "#/ErrorBody"
          - type: object
            properties:
              errorCode:
                const: invalid_json

InvalidContentType:
  description: The request must use application/json.
  content:
    application/json:
      schema:
        allOf:
          - $ref: "#/ErrorBody"
          - type: object
            properties:
              errorCode:
                const: invalid_content_type

ValidationError:
  description: The request data is invalid.
  content:
    application/json:
      schema:
        allOf:
          - $ref: "#/ErrorBody"
          - type: object
            properties:
              errorCode:
                const: validation_error
              fieldErrors:
                type: object
                additionalProperties:
                  type: string

ValidationErrorBody:
  allOf:
    - $ref: "#/ErrorBody"
    - type: object
      properties:
        errorCode:
          const: validation_error
        fieldErrors:
          type: object
          additionalProperties:
            type: string

PublicationRequirementsNotMetBody:
  allOf:
    - $ref: "#/ErrorBody"
    - type: object
      properties:
        errorCode:
          const: publication_requirements_not_met
        fieldErrors:
          type: object
          additionalProperties:
            type: string
        missingFields:
          type: array
          items:
            type: string

ValidationOrPublicationRequirementsNotMet:
  description: The request is invalid or the resource does not meet publication requirements.
  content:
    application/json:
      schema:
        oneOf:
          - $ref: "#/ValidationErrorBody"
          - $ref: "#/PublicationRequirementsNotMetBody"

PublicationRequirementsNotMet:
  description: The event does not meet publication requirements.
  content:
    application/json:
      schema:
        allOf:
          - $ref: "#/ErrorBody"
          - type: object
            properties:
              errorCode:
                const: publication_requirements_not_met
              fieldErrors:
                type: object
                additionalProperties:
                  type: string
              missingFields:
                type: array
                items:
                  type: string

ValidationOrContentPublicationRequirementsNotMet:
  description: The Editorial Content request is invalid or the content does not meet publication requirements. The validation_error response contains optional fieldErrors; the publication_requirements_not_met response contains missingFields.
  content:
    application/json:
      schema:
        oneOf:
          - $ref: "#/ValidationErrorBody"
          - $ref: "#/PublicationRequirementsNotMetBody"

ValidationOrQuizPublicationRequirementsNotMet:
  description: The Quiz request is invalid or the question does not meet publication requirements. Validation errors contain optional fieldErrors; publication requirement failures contain missingFields.
  content:
    application/json:
      schema:
        oneOf:
          - $ref: "#/ValidationErrorBody"
          - $ref: "#/PublicationRequirementsNotMetBody"

PubPublicationRequirementsNotMetBody:
  type: object
  additionalProperties: false
  required: [errorCode, missingFields]
  properties:
    errorCode:
      type: string
      const: publication_requirements_not_met
    missingFields:
      type: array
      uniqueItems: true
      items:
        type: string
        enum: [name, address, prefecture, municipality, latitude, longitude, status, pubType, tags]

PubPublicationRequirementsNotMet:
  description: The pub is missing fields required for publication. Possible field codes are name, address, prefecture, municipality, latitude, longitude, status, pubType, and tags.
  content:
    application/json:
      schema:
        $ref: "#/PubPublicationRequirementsNotMetBody"

PubValidationOrPublicationRequirementsNotMet:
  description: The request is invalid or the pub is missing fields required for publication.
  content:
    application/json:
      schema:
        oneOf:
          - $ref: "#/ValidationErrorBody"
          - $ref: "#/PubPublicationRequirementsNotMetBody"

CalendarConflict:
  description: A calendar event conflicts with an existing event.
  content:
    application/json:
      schema:
        allOf:
          - $ref: "#/ErrorBody"
          - type: object
            properties:
              errorCode:
                const: calendar_conflict
              fieldErrors:
                type: object
                additionalProperties:
                  type: string

CalendarNotFound:
  description: The calendar event does not exist.
  content:
    application/json:
      schema:
        allOf:
          - $ref: "#/ErrorBody"
          - type: object
            properties:
              errorCode:
                const: calendar_not_found

PubNotFound:
  description: The pub does not exist.
  content:
    application/json:
      schema:
        allOf:
          - $ref: "#/ErrorBody"
          - type: object
            properties:
              errorCode:
                const: pub_not_found

ContentNotFound:
  description: The editorial content does not exist.
  content:
    application/json:
      schema:
        allOf:
          - $ref: "#/ErrorBody"
          - type: object
            properties:
              errorCode:
                const: content_not_found

ContentConflict:
  description: The editorial content slug conflicts with an existing item.
  content:
    application/json:
      schema:
        allOf:
          - $ref: "#/ErrorBody"
          - type: object
            properties:
              errorCode:
                const: content_conflict

QuizNotFound:
  description: The quiz question does not exist.
  content:
    application/json:
      schema:
        allOf:
          - $ref: "#/ErrorBody"
          - type: object
            properties:
              errorCode:
                const: quiz_not_found

QuizConflict:
  description: A quiz question conflicts with an existing question.
  content:
    application/json:
      schema:
        allOf:
          - $ref: "#/ErrorBody"
          - type: object
            properties:
              errorCode:
                const: quiz_conflict
              fieldErrors:
                type: object
                additionalProperties:
                  type: string

DatabaseUnavailable:
  description: The database is not configured or available.
  content:
    application/json:
      schema:
        allOf:
          - $ref: "#/ErrorBody"
          - type: object
            properties:
              errorCode:
                const: database_unavailable

InternalError:
  description: An unexpected error occurred.
  content:
    application/json:
      schema:
        allOf:
          - $ref: "#/ErrorBody"
          - type: object
            properties:
              errorCode:
                const: internal_error
