CalendarCategory:
  type: [string, "null"]
  enum: [public_holiday, culture, tradition, language, literature, history, religion, null]

CalendarWeekdayName:
  type: string
  enum: [sunday, monday, tuesday, wednesday, thursday, friday, saturday]

CalendarMonthDay:
  type: object
  additionalProperties: false
  required: [month, day]
  properties:
    month:
      type: integer
      minimum: 1
      maximum: 12
    day:
      type: integer
      minimum: 1
      maximum: 31

CalendarDateRule:
  oneOf:
    - $ref: "#/FixedDateRule"
    - $ref: "#/DateRangeRule"
    - $ref: "#/NthWeekdayRule"
    - $ref: "#/LastWeekdayRule"
    - $ref: "#/RelativeToEasterRule"
    - $ref: "#/WeekdayRelativeRule"
    - $ref: "#/RuleSetDateRule"
    - $ref: "#/AnnualVariableRule"
  discriminator:
    propertyName: type
    mapping:
      fixed: "#/FixedDateRule"
      date_range: "#/DateRangeRule"
      nth_weekday: "#/NthWeekdayRule"
      last_weekday: "#/LastWeekdayRule"
      relative_to_easter: "#/RelativeToEasterRule"
      weekday_on_or_after: "#/WeekdayRelativeRule"
      closest_weekday_to_date: "#/WeekdayRelativeRule"
      rule_set: "#/RuleSetDateRule"
      annual_variable: "#/AnnualVariableRule"

FixedDateRule:
  type: object
  additionalProperties: false
  required: [type, month, day]
  properties:
    type:
      const: fixed
    month:
      type: integer
      minimum: 1
      maximum: 12
    day:
      type: integer
      minimum: 1
      maximum: 31

DateRangeRule:
  type: object
  additionalProperties: false
  required: [type, start, end]
  properties:
    type:
      const: date_range
    start:
      $ref: "#/CalendarMonthDay"
    end:
      $ref: "#/CalendarMonthDay"

NthWeekdayRule:
  type: object
  additionalProperties: false
  required: [type, month, weekday, nth]
  properties:
    type:
      const: nth_weekday
    month:
      type: integer
      minimum: 1
      maximum: 12
    weekday:
      $ref: "#/CalendarWeekdayName"
    nth:
      type: integer
      minimum: 1
      maximum: 5

LastWeekdayRule:
  type: object
  additionalProperties: false
  required: [type, month, weekday]
  properties:
    type:
      const: last_weekday
    month:
      type: integer
      minimum: 1
      maximum: 12
    weekday:
      $ref: "#/CalendarWeekdayName"

RelativeToEasterRule:
  type: object
  additionalProperties: false
  required: [type, offsetDays]
  properties:
    type:
      const: relative_to_easter
    offsetDays:
      type: integer

WeekdayRelativeRule:
  type: object
  additionalProperties: false
  required: [type, month, day, weekday]
  properties:
    type:
      enum: [weekday_on_or_after, closest_weekday_to_date]
    month:
      type: integer
      minimum: 1
      maximum: 12
    day:
      type: integer
      minimum: 1
      maximum: 31
    weekday:
      $ref: "#/CalendarWeekdayName"

RuleSetCondition:
  oneOf:
    - type: object
      additionalProperties: false
      required: [type, month, day, weekday]
      properties:
        type:
          const: fixed_date_weekday
        month:
          type: integer
          minimum: 1
          maximum: 12
        day:
          type: integer
          minimum: 1
          maximum: 31
        weekday:
          $ref: "#/CalendarWeekdayName"
    - type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: otherwise

RuleSetDateRule:
  type: object
  additionalProperties: false
  required: [type, rules]
  properties:
    type:
      const: rule_set
    rules:
      type: array
      minItems: 1
      items:
        type: object
        additionalProperties: false
        required: [when, use]
        properties:
          when:
            $ref: "#/RuleSetCondition"
          use:
            oneOf:
              - $ref: "#/FixedDateRule"
              - $ref: "#/NthWeekdayRule"
              - $ref: "#/LastWeekdayRule"
              - $ref: "#/RelativeToEasterRule"
              - $ref: "#/WeekdayRelativeRule"

AnnualVariableRule:
  type: object
  additionalProperties: false
  required: [type, usualMonth, requiresOfficialConfirmation]
  properties:
    type:
      const: annual_variable
    usualMonth:
      type: integer
      minimum: 1
      maximum: 12
    requiresOfficialConfirmation:
      type: boolean

AdminCalendarTranslation:
  type: object
  additionalProperties: false
  required: [name, description]
  properties:
    name:
      type: string
    description:
      type: string

AdminCalendarTranslations:
  type: object
  additionalProperties: false
  required: [ja, en]
  properties:
    ja:
      $ref: "#/AdminCalendarTranslation"
    en:
      $ref: "#/AdminCalendarTranslation"

AdminCalendarWriteInput:
  type: object
  additionalProperties: false
  required: [category, dateRule, isPublicHoliday, featured, aliases, source, translations]
  properties:
    category:
      $ref: "#/CalendarCategory"
    dateRule:
      oneOf:
        - $ref: "#/CalendarDateRule"
        - type: "null"
    isPublicHoliday:
      type: boolean
    featured:
      type: boolean
    aliases:
      type: array
      items:
        type: string
    source:
      type: [string, "null"]
    translations:
      $ref: "#/AdminCalendarTranslations"

AdminCalendarEvent:
  type: object
  additionalProperties: false
  required:
    [
      id,
      category,
      dateRule,
      isPublicHoliday,
      featured,
      aliases,
      source,
      sortOrder,
      isPublished,
      translations,
      createdAt,
      updatedAt,
    ]
  properties:
    id:
      type: string
      description: Server-generated UUID for new events; existing stable IDs are retained.
      maxLength: 100
      pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
    category:
      $ref: "#/CalendarCategory"
    dateRule:
      oneOf:
        - $ref: "#/CalendarDateRule"
        - type: "null"
    isPublicHoliday:
      type: boolean
    featured:
      type: boolean
    aliases:
      type: array
      items:
        type: string
    source:
      type: [string, "null"]
    sortOrder:
      type: integer
      minimum: 0
    isPublished:
      type: boolean
    translations:
      $ref: "#/AdminCalendarTranslations"
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

AdminCalendarListItem:
  type: object
  additionalProperties: false
  required:
    [
      id,
      category,
      dateRule,
      isPublicHoliday,
      featured,
      aliases,
      source,
      sortOrder,
      isPublished,
      nameJa,
      nameEn,
      createdAt,
      updatedAt,
    ]
  properties:
    id:
      type: string
      maxLength: 100
      pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
    category:
      $ref: "#/CalendarCategory"
    dateRule:
      oneOf:
        - $ref: "#/CalendarDateRule"
        - type: "null"
    isPublicHoliday:
      type: boolean
    featured:
      type: boolean
    aliases:
      type: array
      items:
        type: string
    source:
      type: [string, "null"]
    sortOrder:
      type: integer
      minimum: 0
    isPublished:
      type: boolean
    nameJa:
      type: string
    nameEn:
      type: string
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
