Collection:
  type: object
  additionalProperties: false
  required: [pubs]
  properties:
    pubs:
      type: array
      items: { $ref: "#/Pub" }

Pub:
  type: object
  additionalProperties: false
  required: [id, name, prefecture, address, latitude, longitude, tags, status, pubType]
  properties:
    id: { $ref: "./automation.yaml#/Uuid" }
    name: { type: string, minLength: 1 }
    kana: { type: [string, "null"] }
    prefecture: { type: string, minLength: 1 }
    city: { type: [string, "null"] }
    municipalityCode: { type: [string, "null"], pattern: "^\\d{6}$" }
    address: { type: string, minLength: 1 }
    latitude: { type: number, minimum: -90, maximum: 90 }
    longitude: { type: number, minimum: -180, maximum: 180 }
    websiteUrl: { type: [string, "null"], format: uri, pattern: "^https?://" }
    googleMapsUrl: { type: [string, "null"], format: uri, pattern: "^https?://" }
    instagramUrl: { type: [string, "null"], format: uri, pattern: "^https?://" }
    tags:
      type: array
      items: { type: string, minLength: 1 }
    tagDisplayNames:
      type: object
      additionalProperties: { type: string, minLength: 1 }
    status: { type: string, enum: [open, temporarily_closed, closed, unknown] }
    statusDisplayName: { type: string }
    pubType: { type: string, enum: [irish, british, other, unclassified] }
    pubTypeDisplayName: { type: string }

QueryError:
  type: object
  additionalProperties: false
  required: [error]
  properties:
    error: { type: string, enum: [Unsupported query parameter., Unsupported locale.] }
